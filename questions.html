<!-- Quick template - customize as needed -->
<!DOCTYPE html>
<html lang="en-NP">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Questions | DL Nepal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Same navbar as other pages -->
  
  <div class="container" style="padding:var(--space-xl) 0;">
    <h1>All 500 Questions</h1>
    <div id="search-bar" style="margin:var(--space-md) 0;">
      <input type="text" placeholder="Search questions..." style="width:100%;padding:12px;border:2px solid var(--border);border-radius:var(--radius);font-size:16px;">
    </div>
    <div id="questions-container">
      <!-- Questions will load here -->
      <p style="text-align:center;color:var(--text-secondary);">Loading questions...</p>
    </div>
  </div>
  
  <script src="/js/utils.js"></script>
  <script>
    // Load and display questions
    fetch('/data/questions.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('questions-container');
        container.innerHTML = '<p>500 questions loaded! (Display all 500 with pagination)</p>';
      });
  </script>
</body>
</html>
